<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="tailwind/min.js"></script>
	<title>Aulas</title>
</head>

<body class="min-h-screen bg-cover bg-center bg-no-repeat flex flex-col items-center relative font-sans text-slate-100 p-6">
	<div aria-hidden="true" class="absolute inset-0 bg-slate-950/70 backdrop-blur-md"></div>

	<div th:replace="~{fragments/menu :: menu}"></div>

	<main aria-labelledby="titulo-pagina"
		  class="relative z-10 w-full mx-auto space-y-6 pt-20 px-6 pb-10">

		<h1 id="titulo-pagina"
			class="text-3xl font-extrabold text-center tracking-tight mb-8 text-white">
			Aulas
		</h1>

		<div class="flex justify-end mb-4">
			<button type="button"
					class="flex items-center gap-2 px-4 py-3 bg-yellow-600 hover:bg-yellow-700 text-white font-semibold rounded-lg shadow-md transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900 cursor-pointer"
					th:attr="onclick='abrirModal(' + '\'modal-nova-aula\'' + ')'">

				<svg aria-hidden="true"
					 focusable="false"
					 class="w-5 h-5"
					 fill="none"
					 stroke="currentColor"
					 viewBox="0 0 24 24">
					<path stroke-linecap="round"
						  stroke-linejoin="round"
						  stroke-width="2"
						  d="M12 4v16m8-8H4" />
				</svg>

				Nova aula
			</button>
		</div>

		<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">

			<div th:each="aula : ${aulas}"
				 class="bg-slate-900/60 border border-slate-700/50 rounded-2xl p-5 shadow-xl backdrop-blur-lg flex flex-col transition-all duration-300 hover:border-slate-500 hover:shadow-2xl">

				<div class="border-b border-slate-700/60 pb-3 mb-4 flex items-center justify-between">

					<h2 class="text-lg font-bold text-yellow-400 capitalize"
						th:text="${aula.descricao}">
					</h2>

					<button type="button"
							class="text-slate-300 hover:text-white p-2 rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300 cursor-pointer"
							th:attr="aria-label=|Excluir aula ${aula.descricao}|, onclick=|abrirModal('modal-excluir-aula-${aula.id}')|">

						<svg aria-hidden="true"
							 focusable="false"
							 class="w-6 h-6"
							 fill="none"
							 stroke="currentColor"
							 viewBox="0 0 24 24">
							<path stroke-linecap="round"
								  stroke-linejoin="round"
								  stroke-width="2"
								  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
						</svg>
					</button>

				</div>

				<ul class="space-y-2 flex-1">
				</ul>

				<!-- Modal de exclusão da aula -->
				<div th:id="|modal-excluir-aula-${aula.id}|"
					 role="dialog"
					 aria-modal="true"
					 th:attr="aria-labelledby=|titulo-excluir-aula-${aula.id}|, aria-describedby=|descricao-excluir-aula-${aula.id}|"
					 tabindex="-1"
					 class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">

					<div aria-hidden="true"
						 class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm">
					</div>

					<div class="relative w-full max-w-sm mx-4 bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl p-6 transform scale-95 transition-transform duration-300">

						<div class="flex items-center justify-between pb-4 border-b border-slate-700/60 mb-4">

							<h2 th:id="|titulo-excluir-aula-${aula.id}|"
								class="text-xl font-bold text-yellow-400">
								Excluir aula
							</h2>

							<button type="button"
									th:attr="aria-label=|Fechar confirmação de exclusão da aula ${aula.descricao}|, onclick=|fecharModal('modal-excluir-aula-${aula.id}')|"
									class="text-slate-300 hover:text-white p-2 rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300 cursor-pointer">

								<svg aria-hidden="true"
									 focusable="false"
									 class="w-6 h-6"
									 fill="none"
									 stroke="currentColor"
									 viewBox="0 0 24 24">
									<path stroke-linecap="round"
										  stroke-linejoin="round"
										  stroke-width="2"
										  d="M6 18L18 6M6 6l12 12" />
								</svg>
							</button>

						</div>

						<p th:id="|descricao-excluir-aula-${aula.id}|"
						   class="text-slate-200">
							Tem certeza de que deseja excluir a aula
							<strong th:text="${aula.descricao}"></strong>?
						</p>

						<div class="flex justify-end gap-2 mt-4">

							<button type="button"
									class="px-4 py-3 bg-gray-600 hover:bg-gray-700 text-white font-semibold rounded-lg shadow-md transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300 cursor-pointer"
									th:attr="onclick=|fecharModal('modal-excluir-aula-${aula.id}')|">
								Cancelar
							</button>

							<input type="hidden" name="_method" value="delete" />

							<button type="button"
									class="px-4 py-3 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow-md transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300 cursor-pointer"
									th:attr="onclick=|excluirAula(${aula.id})|">
								Excluir
							</button>

						</div>
					</div>
				</div>

			</div>
		</div>

		<!-- Modal de cadastro de aula -->
		<div id="modal-nova-aula"
			 role="dialog"
			 aria-modal="true"
			 aria-labelledby="titulo-modal-aula"
			 aria-describedby="descricao-modal-aula"
			 tabindex="-1"
			 class="fixed inset-0 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">

			<div aria-hidden="true"
				 class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm">
			</div>

			<div class="relative w-full max-w-sm mx-4 bg-slate-900 border border-slate-700/80 rounded-2xl shadow-2xl p-6 transform scale-95 transition-transform duration-300">

				<div class="flex items-center justify-between pb-4 border-b border-slate-700/60 mb-4">

					<h2 id="titulo-modal-aula"
						class="text-xl font-bold text-yellow-400">
						Nova aula
					</h2>

					<button type="button"
							aria-label="Fechar cadastro de aula"
							class="text-slate-300 hover:text-white p-2 rounded-lg focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300 cursor-pointer"
							onclick="fecharModal('modal-nova-aula')">

						<svg aria-hidden="true"
							 focusable="false"
							 class="w-6 h-6"
							 fill="none"
							 stroke="currentColor"
							 viewBox="0 0 24 24">
							<path stroke-linecap="round"
								  stroke-linejoin="round"
								  stroke-width="2"
								  d="M6 18L18 6M6 6l12 12" />
						</svg>
					</button>

				</div>

				<form id="form-nova-aula" onsubmit="salvar(event)">

					<div>
						<label for="descricao"
							   class="block text-sm font-medium text-slate-200">
							Descrição da aula
						</label>

						<input type="text"
							   id="descricao"
							   name="descricao"
							   required
							   maxlength="150"
							   aria-describedby="ajuda-descricao"
							   class="mt-1 block w-full rounded-md bg-slate-800 border border-slate-600 text-white p-1 focus:border-yellow-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300">
					</div>

					<div class="flex justify-end gap-2 mt-4">

						<button type="button"
								class="px-4 py-3 bg-gray-600 hover:bg-gray-700 text-white font-semibold rounded-lg shadow-md transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300 cursor-pointer"
								onclick="fecharModal('modal-nova-aula')">
							Cancelar
						</button>

						<button type="submit"
								class="px-4 py-3 bg-yellow-600 hover:bg-yellow-700 text-white font-semibold rounded-lg shadow-md transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-yellow-300 cursor-pointer">
							Salvar aula
						</button>

					</div>
				</form>

			</div>
		</div>
	</main>

	<script src="util.js"></script>
	<script src="aula.js"></script>
</body>

</html>
