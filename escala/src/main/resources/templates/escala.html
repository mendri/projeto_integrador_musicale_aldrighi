<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<script src="tailwind/min.js"></script>
	<title>Escala</title>
</head>

<body class="min-h-screen bg-cover bg-center bg-no-repeat flex flex-col items-center relative font-sans text-slate-100 p-6">
	<div class="absolute inset-0 bg-slate-950/70 backdrop-blur-md"></div>
	<div th:replace="~{fragments/menu :: menu}"></div>
	<main class="relative z-10 w-full mx-auto space-y-6 pt-20 px-6 pb-10">
		<h1 class="text-3xl font-extrabold text-center tracking-tight mb-8 text-white drop-shadow">
			Escala de Horários
		</h1>

		<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-6">
			<div th:each="entry : ${escala}"
				 class="bg-slate-900/60 border border-slate-700/50 rounded-2xl p-5 shadow-xl backdrop-blur-lg flex flex-col transition-all duration-300 hover:border-slate-500 hover:shadow-2xl cursor-pointer">

				<div class="border-b border-slate-700/60 pb-3 mb-4 flex items-center justify-between">
					<h2 class="text-lg font-bold text-indigo-400 capitalize" th:text="${entry.value[0] != null ? entry.value[0].diaComercial.descricao : 'Data não disponível'}"></h2>
				</div>

				<ul class="space-y-2 flex-1">
					<li th:each="horario : ${entry.value}"
						class="flex items-center justify-center gap-2 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/60 rounded-xl py-2 px-3 text-sm font-medium text-slate-200 transition-colors">

						<svg class="w-4 h-4 text-indigo-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
							<path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
						</svg>

						<span th:text="${horario.horaInicio} + ' às ' + ${horario.horaFim}"></span>
					</li>
				</ul>
			</div>
		</div>
	</main>

	<script th:inline="javascript">
		let escala = /*[[${escala}]]*/ {};
	</script>
	<script src="escala.js"></script>
</body>

</html>
