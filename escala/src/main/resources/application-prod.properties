# Profile de produção (nuvem). Ativado com SPRING_PROFILES_ACTIVE=prod.
# Os valores vêm de variáveis de ambiente configuradas no Render.
# DATABASE_URL no formato JDBC: jdbc:postgresql://HOST/BANCO?sslmode=require

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# O Render informa a porta pela variável PORT
server.port=${PORT:8080}
